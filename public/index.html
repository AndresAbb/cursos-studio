<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cursos Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;1,9..144,400&family=DM+Sans:wght@300;400;500&family=Caveat:wght@400;600;700&family=Space+Mono&family=Patrick+Hand&family=Architects+Daughter&family=Shadows+Into+Light&family=Permanent+Marker&family=Kalam:wght@400;700&family=Indie+Flower&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css">
</head>
<body>

<div id="root"></div>

<!-- Vanilla JS logic — must define globals before React mounts -->
<script src="/js/api.js"></script>
<script src="/js/utils.js"></script>
<script src="/js/stickers.js"></script>
<script src="/js/notes.js"></script>
<script src="/js/player.js"></script>
<script src="/js/calendar.js"></script>
<script src="/js/courses.js"></script>
<script src="/js/externals.js"></script>
<script src="/js/exams.js"></script>
<script src="/js/settings.js"></script>
<script src="/js/friends.js"></script>
<script src="/js/app.js"></script>

<!-- React 18 + Babel standalone (no build step) -->
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<!-- JSX components — Babel transpiles on load, in DOM order -->
<script type="text/babel" src="/components/Topbar.jsx"></script>
<script type="text/babel" src="/components/Sidebar.jsx"></script>
<script type="text/babel" src="/components/HomeView.jsx"></script>
<script type="text/babel" src="/components/CourseView.jsx"></script>
<script type="text/babel" src="/components/GlobalCalendarView.jsx"></script>
<script type="text/babel" src="/components/PlayerOverlay.jsx"></script>
<script type="text/babel" src="/components/StickerPanel.jsx"></script>
<script type="text/babel" src="/components/App.jsx"></script>

</body>
</html>
